[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers must be registered or pytest emits PytestUnknownMarkWarning.
markers =
    integration: requires a live Neo4j instance (deselect with '-m "not integration"')
    slow: takes more than a few seconds

# Integration tests are excluded by default so a plain `pytest` run works with
# no database. Run them explicitly with `pytest -m integration`.
addopts =
    -ra
    --strict-markers
    -m "not integration"

filterwarnings =
    ignore::DeprecationWarning:neo4j.*
